name: CI

on:
  pull_request: &paths
    paths:
      - '*.yaml'
      - '.github/workflows/ci.yml'
  push: *paths
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Building
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: ESPHome Build
        uses: esphome/build-action@82ec6bded4e0998e1cda757680e5f1ac85825cfd  # v7.4.0
        with:
          yaml-file: snuffelaar-esp32.yaml
          version: 2026.5.1 #esphome-version
      - name: ESPHome Build (Factory)
        uses: esphome/build-action@82ec6bded4e0998e1cda757680e5f1ac85825cfd  # v7.4.0
        with:
          yaml-file: snuffelaar-esp32.factory.yaml
          version: 2026.5.1 #esphome-version
